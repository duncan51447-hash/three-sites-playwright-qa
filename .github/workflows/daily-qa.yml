name: Daily Three-Site QA

on:
  workflow_dispatch:
  schedule:
    # 06:00 Asia/Taipei = 22:00 UTC on the previous day
    - cron: '0 22 * * *'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  playwright-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run desktop and mobile QA
        run: npx playwright test
        env:
          TZ: Asia/Taipei

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-qa-report-${{ github.run_number }}
          path: |
            playwright-report/
            test-results/
          retention-days: 30
