name: Daily Three-Site QA

on:
  workflow_dispatch:
    inputs:
      scope:
        description: QA coverage
        required: true
        default: full
        type: choice
        options: [full, smoke]
      resume_run_id:
        description: Optional same-version run ID; resume incomplete pages from its combined artifact
        required: false
        type: string
      inventory_run_id:
        description: Optional same-day fixed inventory run ID, for QA-engine fixes without recrawling
        required: false
        type: string
  schedule:
    - cron: '0 22 * * *'

permissions:
  contents: read
  actions: read

concurrency:
  group: three-sites-${{ inputs.scope || 'full' }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      matrix: ${{ steps.inventory.outputs.matrix || steps.reuse.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build fixed public-page inventory
        id: inventory
        if: ${{ inputs.inventory_run_id == '' }}
        run: npm run prepare:qa
        env:
          QA_SCOPE: ${{ inputs.scope || 'full' }}
      - name: Reuse immutable same-day inventory when requested
        if: ${{ inputs.inventory_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: qa-manifest
          path: qa-manifest
          run-id: ${{ inputs.inventory_run_id }}
          github-token: ${{ github.token }}
      - name: Validate reused inventory
        id: reuse
        if: ${{ inputs.inventory_run_id != '' }}
        run: node scripts/reuse-inventory.mjs
        env:
          QA_SCOPE: ${{ inputs.scope || 'full' }}
      - name: Upload inventory even when discovery is incomplete
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-manifest
          path: qa-manifest/
          retention-days: 30

  browser-qa:
    needs: inventory
    if: ${{ !cancelled() && needs.inventory.outputs.matrix != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 18
      matrix: ${{ fromJSON(needs.inventory.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium --only-shell
      - uses: actions/download-artifact@v4
        with:
          name: qa-manifest
          path: qa-manifest
      - name: Restore completed pages when explicitly resuming
        if: ${{ inputs.resume_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: qa-combined-results
          path: resume-results
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ github.token }}
      - name: Run independent page and click tests
        run: npx playwright test --project="${{ matrix.project }}"
        env:
          TZ: Asia/Taipei
          QA_SITE: ${{ matrix.site }}
          QA_PROJECT: ${{ matrix.project }}
          QA_SHARD_INDEX: ${{ matrix.shard }}
          QA_SHARD_TOTAL: ${{ matrix.shards }}
          QA_RESUME_DIR: ${{ inputs.resume_run_id != '' && 'resume-results/qa-results' || '' }}
          QA_WORKERS: '4'
      - name: Upload per-page checkpoints even on timeout
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-results-${{ matrix.site }}-${{ matrix.project }}-${{ matrix.shard }}
          path: |
            qa-results/
            qa-report/
            playwright-report/
            test-results/
          retention-days: 30

  report:
    if: always()
    needs: [inventory, browser-qa]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: qa-manifest
          path: qa-manifest
      - uses: actions/download-artifact@v4
        with:
          pattern: qa-results-*
          path: downloaded-results
      - name: Combine raw checkpoints without losing page identities
        run: node scripts/combine-qa.mjs
      - name: Generate Chinese report and fail on missing coverage
        id: report
        run: npm run report:qa
      - name: Upload complete raw data and Chinese report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-combined-results
          path: |
            qa-results/
            qa-manifest/
            qa-report/
          retention-days: 30
